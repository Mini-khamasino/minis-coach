<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="pwa-192.png" />
    <link rel="apple-touch-icon" href="pwa-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Mini's Coach</title>
    <script>
      // theme, accent and language before first paint (no flash)
      try {
        var d = document.documentElement, t = localStorage.getItem('theme') || 'system'
        d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t
        d.dataset.accent = localStorage.getItem('accent') || 'blue'
        if (localStorage.getItem('lang') === 'en') { d.lang = 'en'; d.dir = 'ltr' }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
